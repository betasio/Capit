name: Android prototype
on:
  push:
    branches: [main, 'capit/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/dom.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Capit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
  visual-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Capit-debug-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p previews
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb install apk/app-debug.apk
            adb shell am start -W -n app.capit/.MainActivity
            sleep 4
            adb shell am force-stop com.google.android.apps.nexuslauncher
            sleep 2
            adb shell pidof app.capit
            adb exec-out screencap -p > previews/home.png
            adb shell settings put system font_scale 1.3
            adb shell am force-stop app.capit
            adb shell am start -W -n app.capit/.MainActivity
            sleep 3
            adb shell am force-stop com.google.android.apps.nexuslauncher
            sleep 2
            adb shell pidof app.capit
            adb exec-out screencap -p > previews/home-large-text.png
            adb shell settings put system font_scale 1.0
            adb shell wm size 960x1920
            adb shell wm density 480
            adb shell am force-stop app.capit
            adb shell am start -W -n app.capit/.MainActivity
            sleep 3
            adb shell am force-stop com.google.android.apps.nexuslauncher
            sleep 2
            adb shell pidof app.capit
            adb exec-out screencap -p > previews/home-compact.png
            adb shell input swipe 480 1400 480 600 350
            sleep 1
            adb exec-out screencap -p > previews/home-compact-scrolled.png
      - uses: actions/upload-artifact@v4
        with:
          name: Capit-design-previews
          overwrite: true
          path: previews/
          if-no-files-found: error
